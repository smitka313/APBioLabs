name: Classroom release smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-release-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assignments:
    name: Open, save, resume and read submissions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/classroom-release-smoke.js
