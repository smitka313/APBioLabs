name: Bear Ancestry Lab
on:
  pull_request:
    paths:
      - 'openscied-b5-ancestry*'
      - 'assets/openscied-bear-ancestry.svg'
      - 'assets/openscied-bear-profile-*.svg'
      - 'tests/openscied-b5-ancestry*'
      - '.github/workflows/openscied-ancestry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ancestry-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/openscied-b5-ancestry-browser.js
