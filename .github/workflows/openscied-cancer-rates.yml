name: Cancer Rates Data Dive
on:
  pull_request:
    paths:
      - 'openscied-b3-cancer-rates*'
      - 'assets/*cancer-rates*'
      - 'tests/openscied-b3-cancer-rates*'
      - '.github/workflows/openscied-cancer-rates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cancer-rates-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node --test tests/openscied-b3-cancer-rates-logic.test.js
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/openscied-b3-cancer-rates-browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openscied-cancer-rates-viewports
          path: artifacts/openscied-cancer-rates/
          if-no-files-found: ignore
