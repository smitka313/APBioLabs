name: Serengeti Field Notebook
on:
  pull_request:
    paths:
      - 'openscied-b1-field-notebook*'
      - 'assets/serengeti-field-*.svg'
      - 'assets/serengeti-field-station-*.webp'
      - 'assets/openscied-atlas-b1-field-notebook.svg'
      - 'tests/openscied-b1-field-notebook*'
      - '.github/workflows/openscied-field-notebook.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  field-notebook-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node --test tests/openscied-b1-field-notebook.test.js
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/openscied-b1-field-notebook-browser.js
      - run: FIELD_BROWSER=webkit node tests/openscied-b1-field-notebook-browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serengeti-field-notebook-viewports
          path: artifacts/field-notebook/
          if-no-files-found: ignore
