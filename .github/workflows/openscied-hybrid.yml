name: Arctic Bear Futures and Hybridization
on:
  pull_request:
    paths:
      - 'openscied-b5-hybrid*'
      - 'assets/openscied-hybrid-*.svg'
      - 'assets/openscied-atlas-b5-hybrid.svg'
      - 'assets/openscied-b5-hybrid-map.svg'
      - 'tests/openscied-b5-hybrid*'
      - '.github/workflows/openscied-hybrid.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hybridization-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/openscied-b5-hybrid-data.js
      - run: python3 tools/build-seo.py --check
      - run: HYBRID_SCREENSHOTS=/tmp/hybrid-screenshots node tests/openscied-b5-hybrid-browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybridization-visual-checks
          path: /tmp/hybrid-screenshots
          if-no-files-found: ignore
