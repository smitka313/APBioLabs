name: OpenSciEd live release verification
on:
  push:
    branches: ['qa/openscied-live-20261126']
permissions:
  contents: read
jobs:
  live-release-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/openscied-live-release-qa.cjs
