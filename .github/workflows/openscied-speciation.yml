name: Ice Age Bear Speciation Explorer
on:
  pull_request:
    paths:
      - 'openscied-b5-speciation*'
      - 'assets/openscied-ice-age-*.svg'
      - 'tests/openscied-b5-speciation*'
      - '.github/workflows/openscied-speciation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  speciation-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/openscied-b5-speciation-data.js
      - run: python3 tools/build-seo.py --check
      - run: ICE_SCREENSHOTS=/tmp/speciation-screenshots node tests/openscied-b5-speciation-browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ice-age-visual-checks
          path: /tmp/speciation-screenshots
          if-no-files-found: ignore
