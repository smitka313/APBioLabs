name: OpenSciEd video players
on:
  pull_request:
    paths:
      - 'openscied-video.*'
      - 'openscied-b1-migration.html'
      - 'openscied-b1-serengeti.html'
      - 'openscied-b3-inheritance-environment.html'
      - 'tests/openscied-video*'
      - '.github/workflows/openscied-video.yml'
permissions:
  contents: read
jobs:
  video-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/openscied-video.test.js && node tests/openscied-video-browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openscied-video-viewports
          path: test-artifacts/ose-video/*.png
          if-no-files-found: ignore
