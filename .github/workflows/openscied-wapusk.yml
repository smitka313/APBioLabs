name: Three Bears in Wapusk
on:
  pull_request:
    paths:
      - 'openscied-b5-wapusk*'
      - 'assets/openscied-wapusk.svg'
      - 'assets/wapusk-*.webp'
      - 'tests/openscied-b5-wapusk*'
      - '.github/workflows/openscied-wapusk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wapusk-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/openscied-b5-wapusk-browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openscied-wapusk-viewports
          path: artifacts/wapusk/
          if-no-files-found: ignore
