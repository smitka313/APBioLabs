# Browser tests for Lab Bench (Playwright). See tests/README.md.
# - push / pull_request to main: the release-checklist set, split into parallel jobs.
# - Every run: a Firefox + WebKit smoke test (tests/t60-browsers.js).
# - Actions tab -> "Tests" -> "Run workflow": choose "checklist" or "all" (every test, split into 5 shards).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: "Which tests to run"
        type: choice
        options: [checklist, all]
        default: all

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  student-pdfs:
    name: Downloadable student guides
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tools/build-student-pdfs.py --check
      - run: python3 -m pip install -r tools/pdf-requirements.txt
      - run: python3 tests/student-pdfs.test.py
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/t108-student-pdfs.js

  seo:
    name: Search metadata and crawlability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build-seo.py --check
      - run: python3 tests/seo.test.py

  domain-redirect:
    name: Domain redirect and saved-work protection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node --test tests/domain-redirect.test.js
      - name: Check completion-audit regressions
        run: node --test tests/audit6-followup.test.js tests/submission-readiness.test.js tests/lab3-clock-recording.test.js
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/domain-redirect-browser.js

  classify:
    name: Select test level
    runs-on: ubuntu-latest
    outputs:
      level: ${{ steps.risk.outputs.level }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: risk
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            node tools/classify-ci-risk.js "$BASE_SHA" "$HEAD_SHA"
          else
            echo "level=full" >> "$GITHUB_OUTPUT"
          fi

  quick:
    name: Quick syntax and lab-page smoke
    needs: classify
    if: github.event_name == 'pull_request' && contains(fromJSON('["quick","ui"]'), needs.classify.outputs.level)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          node --check lab.js
          NODE_PATH="$PWD/node_modules" node tests/t62-onboarding-quick.js
          NODE_PATH="$PWD/node_modules" node tests/t60-browsers.js pages

  ui:
    name: Focused instructional UI accessibility
    needs: classify
    if: github.event_name == 'pull_request' && needs.classify.outputs.level == 'ui'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check disclosure keyboard access
        run: |
          export NODE_PATH="$PWD/node_modules"
          node tests/t63-instructional-disclosures.js

  checklist:
    name: Checklist (${{ matrix.group }})
    needs: classify
    if: (github.event_name != 'workflow_dispatch' || inputs.suite == 'checklist') && needs.classify.outputs.level != 'quick'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        group: [core, e2e, science, a11y-axe, a11y-keys, a11y-resp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run tests
        env:
          JOBS: "1"   # the timing-sensitive persist tests are flaky when two run at once on a 2-core runner
        run: |
          export NODE_PATH="$PWD/node_modules"
          export AXE="$PWD/node_modules/axe-core/axe.min.js"
          node tests/run-all.js ${{ matrix.group }}

  browsers:
    name: Cross-browser smoke (${{ matrix.browser }})
    needs: classify
    if: needs.classify.outputs.level == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run t60-browsers
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          export NODE_PATH="$PWD/node_modules"
          node tests/run-all.js t60-browsers

  full:
    name: Full suite (shard ${{ matrix.shard }}/5)
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install PDF tools (t18, t36)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils unzip python3-pil python3-numpy
      - name: Run tests
        env:
          JOBS: "1"
        run: |
          export NODE_PATH="$PWD/node_modules"
          export AXE="$PWD/node_modules/axe-core/axe.min.js"
          node tests/run-all.js all --shard ${{ matrix.shard }}/5



